[package]
name = "energybrain-web"
description = "The web app (Leptos SSR + hydration): components, routes, server functions. Outside the coverage gate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
energybrain-view = { version = "0.1.0", path = "../view" }
leptos = "0.8.23"
leptos_router = "0.8.17"
serde = { version = "1.0.229", features = ["derive"] }
wasm-bindgen = "0.2.130"

# Browser half (`hydrate`).
serde_json = { version = "1.0.154", optional = true }
web-sys = { version = "0.3.107", features = ["EventSource", "MessageEvent"], optional = true }

# Server half (`ssr`).
axum = { version = "0.8.9", optional = true }
energybrain-http = { version = "0.1.0", path = "../http", optional = true }
leptos_axum = { version = "0.8.10", optional = true }
tokio = { version = "1.54.1", features = ["rt"], optional = true }

[features]
hydrate = ["leptos/hydrate", "dep:serde_json", "dep:web-sys"]
ssr = [
  "leptos/ssr",
  "leptos_router/ssr",
  "dep:axum",
  "dep:energybrain-http",
  "dep:leptos_axum",
  "dep:tokio",
]

[lints]
workspace = true
