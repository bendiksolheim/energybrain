[package]
name = "energybrain-http"
description = "HTTP: /healthz, /metrics, /api/*, and the history page."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
energybrain-core = { version = "0.1.0", path = "../core" }
jiff = "1.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt"] }

[lints]
workspace = true

[dev-dependencies]
energybrain-core = { path = "../core", features = ["test-support"] }
insta = "1.49.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
