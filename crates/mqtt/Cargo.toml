[package]
name = "energybrain-mqtt"
description = "MQTT adapter: topic/payload translation and rumqttc transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
energybrain-config = { version = "0.1.0", path = "../config" }
energybrain-core = { version = "0.1.0", path = "../core" }
energybrain-han = { version = "0.1.0", path = "../han" }
jiff = "0.2.46"
rumqttc = { version = "0.25.1", default-features = false }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }

[lints]
workspace = true

[dev-dependencies]
rumqttd = { version = "0.20.0", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.2.1"
