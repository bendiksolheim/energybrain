[package]
name = "energybrain-view"
description = "Pure presentation: history views, what the web app shows, chart geometry. Native and wasm32."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
energybrain-core = { version = "0.1.0", path = "../core" }
jiff = { version = "1.0.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[features]
# Exposes `history::fixtures` for tests in downstream crates.
test-support = []

[dev-dependencies]
insta = "1.49.0"

[lints]
workspace = true
