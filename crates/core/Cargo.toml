[package]
name = "energybrain-core"
description = "Pure domain: units, clock, time, tariff, energy accounting, peaks, zones, policies, arbiter, actuator, engine. No async, no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jiff = { version = "1.0.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[features]
# Exposes `SimClock` and other helpers for tests in downstream crates.
test-support = []

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
serde_json = "1.0.154"

[lints]
workspace = true
