[package]
name = "energybrain-sim"
description = "Development only: a simulated house (HAN meter, Z-TRM3 thermostats, household loads) on MQTT."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
energybrain = { version = "0.1.0", path = "../app" }
energybrain-config = { version = "0.1.0", path = "../config" }
energybrain-core = { version = "0.1.0", path = "../core" }
energybrain-easee = { version = "0.1.0", path = "../easee" }
energybrain-han = { version = "0.1.0", path = "../han" }
energybrain-mqtt = { version = "0.1.0", path = "../mqtt" }
energybrain-store = { version = "0.1.0", path = "../store" }
jiff = "1.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
energybrain-core = { path = "../core", features = ["test-support"] }
insta = "1.49.0"
rumqttd = { version = "0.20.0", default-features = false }
tempfile = "3.27.0"

[lints]
workspace = true
