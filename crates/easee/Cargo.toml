[package]
name = "energybrain-easee"
description = "Easee cloud API adapter for the EV charger: observations in, dynamic-current commands out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
energybrain-config = { version = "0.1.0", path = "../config" }
energybrain-core = { version = "0.1.0", path = "../core" }
jiff = "1.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
energybrain-core = { path = "../core", features = ["test-support"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
