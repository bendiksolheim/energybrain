name: release

# Publishing a GitHub release builds the image and pushes it to Docker Hub.
#
# Repository settings needed (Settings → Secrets and variables → Actions):
#   secret DOCKER_USERNAME  Docker Hub account that owns the repository (also the image namespace)
#   secret DOCKER_PASSWORD  Docker Hub access token with Read & Write scope (or the password)
# Same names as in the other repositories that publish to Docker Hub. Because the username is a
# secret, the image name shows up as ***/energybrain in the logs.
#
# Releases are numbered with plain integers: a release tagged v3 (or 3) pushes 3 and latest.
# A pre-release gets a suffix (v4-rc.1) and pushes only 4-rc.1, leaving latest alone.
# Any other tag name stops the workflow in the first job, before anything is built or pushed.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/energybrain

jobs:
  # Without this, a tag the pattern below doesn't match would push only `latest`.
  tag:
    runs-on: ubuntu-latest
    steps:
      - env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v?[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Release tag '$TAG' must be v<N> (or v<N>-<suffix> for a pre-release)"
            exit 1
          fi

  # Same gate as main: fmt, clippy, tests, coverage. A red commit never becomes an image.
  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml

  push:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=match,pattern=^v?(\d+(-[0-9A-Za-z.]+)?)$,group=1
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          # The home server is amd64; arm64 under QEMU would multiply the Rust build time.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
