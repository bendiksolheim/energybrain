# The local dev broker for `just dev` (mosquitto in a container). Anonymous and
# without persistence: `just dev` recreates it every run, so retained topics from an
# earlier run (mode, setpoints, other simulated times) never leak into the next one.
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
