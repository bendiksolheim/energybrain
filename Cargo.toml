[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allow-list for pedantic lints that add noise without catching bugs here.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# CLAUDE.md: no unwrap/expect outside tests unless the invariant is documented.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The browser half of the web app (PLAN.md §10): small over fast.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"

# `cargo leptos build` builds the server binary and the browser bundle (target/site).
[[workspace.metadata.leptos]]
name = "energybrain"
output-name = "energybrain"
bin-package = "energybrain"
bin-target = "energybrain"
lib-package = "energybrain-web"
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "crates/web/style/main.css"
env = "PROD"
# Dev builds would otherwise use `--cfg erase_components`, which changes the view types: the
# browser bundle then fails to hydrate pages from servers built by plain `cargo` (the simulator).
disable-erase-components = true
