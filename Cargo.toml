[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allow-list for pedantic lints that add noise without catching bugs here.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# CLAUDE.md: no unwrap/expect outside tests unless the invariant is documented.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
