# energybrain configuration — the real setup of this house, minus credentials.
#
# Copy it to a gitignored location (deploy/energybrain.toml, or config/local.toml) and point
# the service at it with ENERGYBRAIN_CONFIG or the first command-line argument. Units: power
# in kW, energy in kWh, temperatures in °C; durations carry their unit in the key name.
# Unknown keys are rejected, and any invalid value stops startup with the offending key named.
# Keys shown commented out are optional and show their default.

# IANA time zone used to decide which local day and month an hour belongs to. The capacity
# tariff counts local days, so this must match where the meter is; DST is handled for you.
timezone = "Europe/Oslo"

[mqtt]
# Host name or IP address of the MQTT broker that Z-Wave JS UI, the Tibber Pulse and
# Homebridge also use. Plain TCP only; TLS is not supported.
host = "192.168.1.10"
# Broker TCP port. 1883 is the standard unencrypted MQTT port.
port = 1883
# Client id this service connects with. It must be unique on the broker, or the broker will
# keep disconnecting whichever client connected first.
client_id = "energybrain"
# Seconds between keep-alive pings. A broker that hears nothing for 1.5 × this considers the
# connection dead; values below 5 are raised to 5.
keep_alive_secs = 30
# Prefix of every topic this service publishes, or listens to for HomeKit (e.g. <prefix>/mode,
# <prefix>/zone/bathroom/shed). Must not contain the MQTT wildcards + or #.
# prefix = "energybrain"
# Broker credentials. Prefer the environment variables ENERGYBRAIN_MQTT_USERNAME and
# ENERGYBRAIN_MQTT_PASSWORD, which override these keys; never commit real values.
# username = ""
# password = ""

[http]
# Address and port of the HTTP server: the history page at /, plus /healthz, /metrics,
# /api/state, /api/events, /api/day and /api/month.
# 0.0.0.0 listens on all interfaces, which is what a Docker port mapping needs.
listen = "0.0.0.0:8080"

[store]
# Path of the SQLite database holding hourly energy, learned zone state, overrides, the mode,
# the event log and the samples for the history graphs. It is created on first start; in
# Docker it lives on the /data volume.
path = "/data/energybrain.db"
# Days to keep the 1-minute samples behind the history page's minute graphs (power, the hour
# budget, setpoints, sheds). About 0.5 MB a day. Older days still show their hourly energy and
# every event; only the minute curves are gone. At least 1.
sample_retention_days = 90

[meter]
# Topic the Tibber Pulse publishes raw HAN frames to: power every 2.5 s and 10 s, and the
# cumulative import register once an hour. The Pulse's own JSON status messages are ignored.
topic = "tibber"
# Length of the moving average used as "current power" when projecting the rest of the hour.
# Longer makes a kettle or oven spike less likely to trigger shedding, but reacts more slowly.
power_window_secs = 60
# With no power reading for this many seconds the meter counts as stale: nothing new is shed,
# every shed floor is restored (staggered), and /healthz reports unhealthy.
stale_after_secs = 120

[tariff]
# The grid company's capacity tiers: `to_kw` is each band's exclusive upper bound and `price`
# its monthly cost in kr, and the last band has no `to_kw`. Bands are half-open, so an average
# of exactly 5.0 kW falls in 5–10. These are Tensio TS 2026, see docs/tier-table.md.
tiers = [
  { to_kw = 2, price = 131 },
  { to_kw = 5, price = 233 },
  { to_kw = 10, price = 397 },
  { to_kw = 15, price = 585 },
  { to_kw = 20, price = 775 },
  { to_kw = 25, price = 964 },
  { to_kw = 50, price = 1655 },
  { to_kw = 75, price = 2599 },
  { to_kw = 100, price = 3544 },
  { to_kw = 150, price = 5117 },
  { to_kw = 200, price = 7003 },
  { to_kw = 300, price = 10147 },
  { to_kw = 400, price = 13925 },
  { to_kw = 500, price = 17697 },
  { price = 21473 },
]
# Upper bound (kW) of the tier to stay in; it must equal one of the `to_kw` values above.
# Each hour may then use this many kWh, or more if today has already had a higher hour.
target_kw = 5
# Headroom (kWh) subtracted from the allowed energy before the guard acts, to cover projection
# error. A larger margin sheds earlier and more often, but makes breaking the tier less likely.
safety_margin_kwh = 0.3

[guard]
# A shed floor is only restored when the projection with it switched back on stays this many
# kWh below the limit. This hysteresis stops it from being restored and shed again a minute later.
release_margin_kwh = 0.3
# Minimum minutes a floor stays shed before it may be restored, so heaters do not cycle rapidly.
# A user override, a stale meter or leaving active mode restores it without waiting.
min_shed_minutes = 5
# At most one floor is restored per this many minutes, the most recently shed first, so the
# floors do not all switch back on at once and cause a new spike.
restore_stagger_minutes = 2
# Seconds a freshly shed floor's saving is credited before the meter's moving average is
# trusted to show it. Without this the guard would shed extra floors while the average catches up.
settle_secs = 90

[actuator]
# Setpoint differences up to this many °C are not worth a write, so a thermostat is never
# rewritten over a rounding difference in what it reports back.
deadband = 0.25
# Minimum seconds between two writes that lower the same thermostat, to keep Z-Wave traffic
# down. Writes that restore a floor are never delayed by this.
min_interval_secs = 60

[zones]
# A reported setpoint within this many °C of our own last write counts as the thermostat
# echoing us, not as a user change. Keep it below the thermostat's setpoint step (Z-TRM3: 0.5).
echo_tolerance = 0.25
# Raising a shed floor in the Home app keeps that floor out of shedding for this many minutes.
# Afterwards it may be shed again, measured from your new setpoint.
override_minutes = 120
# A zone's power report above this many kW counts as "heating". Only heating floors are shed,
# and only such reports teach the service the floor's heater power.
heating_threshold_kw = 0.05
# How strongly each new power report updates a floor's learned heater power, between 0 and 1.
# Lower is steadier but learns more slowly; 0.2 has mostly settled after about ten reports.
learn_rate = 0.2

# Thermostat topics, relative to each zone's `device`. These are the Heatit Z-TRM3 values as
# Z-Wave JS UI publishes them in "value only" mode (plain numbers, no JSON).
[thermostat]
# Heating setpoint in °C. Writes go to `<device>/<setpoint>/set` as a plain number.
setpoint = "67/1/setpoint/1"
# Power the heater draws right now, in watts (about 0.1 W while idle).
power = "50/1/value/66049"
# The thermostat's own cumulative energy counter in kWh, used to log each floor's hourly use.
energy = "50/1/value/65537"

# One [[zone]] per floor-heating thermostat. Required keys:
#   id        Short name used in topics and the database: lower-case letters, digits, _ or -.
#   device    The thermostat's topic in Z-Wave JS UI, zwave/<Room>/<Device>.
#   priority  Shed order: LOWER numbers are shed first and restored last. Equal numbers are
#             shed in id order.
# Optional keys, with their defaults:
#   name = <id>          Display name in /api/state and the status JSON.
#   shed_allowed = true  Whether the guard may shed this floor. HomeKit can switch it per zone
#                        at runtime, and that runtime choice wins over this file.
#   shed_delta = 4.0     How many °C below your own setpoint the floor is set while shed; 4 °C
#                        is enough to switch the heater off.
#   min_setpoint = 5.0   Lowest setpoint ever written: a shed never goes below this.
#   max_setpoint = 35.0  Highest setpoint ever written, even if you or an override ask for more.
#   nominal_kw = 1.0     Assumed heater power until the floor has been seen heating and its
#                        real power learned. Learned values survive restarts.
#   setpoint_topic, power_topic, energy_topic
#                        Full topics replacing `<device>/<[thermostat] suffix>`, for a device
#                        that publishes elsewhere.

# Large room with the biggest heater, so shedding it helps the most.
[[zone]]
id = "bathroom"
name = "Bathroom"
device = "zwave/Bathroom/Floor_bathroom"
priority = 1

# Laundry-room heating cable, measured at about 575 W.
[[zone]]
id = "laundry"
name = "Laundry"
device = "zwave/Laundry/Heating_cable"
priority = 2
nominal_kw = 0.6

[[zone]]
id = "hallway"
name = "Hallway"
device = "zwave/Hallway/Floor_hallway"
priority = 3

[[zone]]
id = "guest_1"
name = "Guest 1"
device = "zwave/Guest/Floor_guest_1"
priority = 4

[[zone]]
id = "guest_2"
name = "Guest 2"
device = "zwave/Guest/Floor_guest_2"
priority = 5

# Already kept at 15 °C, so shedding it gains little: last.
[[zone]]
id = "basement"
name = "Basement"
device = "zwave/Basement/Floor_basement"
priority = 6
